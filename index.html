<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mibanco por WhatsApp — Mockup de pantallas</title>
<style>
  :root {
    --wa-bg: #efeae2;
    --wa-header: #075e54;
    --wa-header-dark: #054c44;
    --wa-green-bubble: #d9fdd3;
    --wa-white-bubble: #ffffff;
    --wa-text: #111b21;
    --wa-text-secondary: #667781;
    --wa-accent: #00a884;
    --wa-blue-check: #53bdeb;
    --panel-bg: #f0f2f5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  h1 {
    font-size: 18px;
    color: var(--wa-text);
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--wa-text-secondary);
    font-size: 13px;
    margin-bottom: 24px;
    text-align: center;
    max-width: 420px;
  }

  /* Selector de escenas */
  .scene-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 380px;
  }

  .scene-btn {
    border: 1px solid #d1d7db;
    background: white;
    color: var(--wa-text);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .scene-btn:hover { background: #f5f5f5; }

  .scene-btn.active {
    background: var(--wa-accent);
    border-color: var(--wa-accent);
    color: white;
  }

  /* Marco del teléfono */
  .phone {
    width: 375px;
    height: 720px;
    background: black;
    border-radius: 40px;
    padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .screen {
    width: 100%;
    height: 100%;
    background: var(--wa-bg);
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Header estilo WhatsApp */
  .chat-header {
    background: var(--wa-header);
    color: white;
    padding: 14px 12px 10px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .chat-header .back {
    font-size: 20px;
    width: 20px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--wa-header);
    font-size: 14px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-name { font-size: 15px; font-weight: 600; }
  .header-status { font-size: 11px; opacity: 0.85; }
  .header-icons { display: flex; gap: 18px; font-size: 16px; }

  /* Área de mensajes */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 50%);
  }

  .day-divider {
    align-self: center;
    background: #e1f2fb;
    color: #54656f;
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 6px;
    margin: 8px 0;
  }

  .bubble-row {
    display: flex;
    margin: 3px 0;
  }

  .bubble-row.in { justify-content: flex-start; }
  .bubble-row.out { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 6px 8px 7px 9px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.35;
    position: relative;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    white-space: pre-line;
  }

  .bubble.in { background: var(--wa-white-bubble); border-top-left-radius: 0; }
  .bubble.out { background: var(--wa-green-bubble); border-top-right-radius: 0; }

  .bubble .meta {
    display: block;
    text-align: right;
    font-size: 10.5px;
    color: var(--wa-text-secondary);
    margin-top: 2px;
    margin-left: 8px;
    float: right;
  }

  .bubble .check { color: var(--wa-blue-check); margin-left: 2px; }

  /* Botones de menú interactivo (list message) */
  .menu-bubble {
    background: var(--wa-white-bubble);
    border-radius: 8px;
    border-top-left-radius: 0;
    max-width: 82%;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    overflow: hidden;
  }

  .menu-body { padding: 8px 9px 6px 9px; font-size: 14px; white-space: pre-line; }
  .menu-body .meta { display: block; text-align: right; font-size: 10.5px; color: var(--wa-text-secondary); margin-top: 4px; }

  .menu-option {
    border-top: 1px solid #ecebe9;
    padding: 11px 12px;
    color: var(--wa-accent);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    cursor: default;
  }

  /* Botones de respuesta rápida */
  .quick-replies {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-self: flex-start;
    max-width: 82%;
    margin: 4px 0 8px 0;
  }

  .quick-reply-btn {
    background: white;
    border: 1px solid #d1d7db;
    color: var(--wa-accent);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    text-align: center;
  }

  /* Documento adjunto simulado */
  .doc-card {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f5f2ec;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 4px;
  }

  .doc-icon {
    width: 34px;
    height: 34px;
    background: #d1483f;
    color: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .doc-name { font-size: 12.5px; font-weight: 600; }
  .doc-size { font-size: 11px; color: var(--wa-text-secondary); }

  /* Barra de entrada inferior */
  .input-bar {
    background: #f0f2f5;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .input-pill {
    flex: 1;
    background: white;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 13.5px;
    color: var(--wa-text-secondary);
  }

  .mic-btn {
    width: 36px;
    height: 36px;
    background: var(--wa-accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
  }

  .scene-caption {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--wa-text-secondary);
    text-align: center;
    max-width: 320px;
  }

  code {
    background: #e8e8e8;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }
</style>
</head>
<body>

  <h1>Mibanco por WhatsApp</h1>
  <div class="subtitle">Mockup navegable del flujo de desembolso. Edita el arreglo <code>scenes</code> en el JS para cambiar los mensajes de cada pantalla.</div>

  <div class="scene-selector" id="sceneSelector"></div>

  <div class="phone">
    <div class="screen">
      <div class="chat-header">
        <div class="back">‹</div>
        <div class="avatar">MB</div>
        <div class="header-info">
          <div class="header-name">Mibanco</div>
          <div class="header-status" id="headerStatus">en línea</div>
        </div>
        <div class="header-icons">
          <div>📹</div>
          <div>📞</div>
          <div>⋮</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <div class="input-pill">Mensaje</div>
        <div class="mic-btn">🎤</div>
      </div>
    </div>
  </div>

  <div class="scene-caption" id="sceneCaption"></div>

<script>
  // ── DATA: cada "scene" representa una pantalla / paso del flujo ──
  // Edita este arreglo para reflejar tus propias pantallas.
  const scenes = [
    {
      id: "bienvenida",
      label: "1. Bienvenida",
      caption: "Primer contacto: el cliente escribe al canal y recibe el menú principal.",
      messages: [
        { type: "day" , text: "Hoy" },
        { type: "out", text: "Hola, quiero contratar un producto de Doctor+", time: "09:14" },
        { type: "menu",
          text: "¡Hola! 👋 Soy el asistente de Mibanco.\n¿En qué te puedo ayudar hoy?",
          time: "09:14",
          options: ["💰 Solicitar un préstamo", "📄 Ver estado de mi solicitud", "🧑‍💼 Hablar con un asesor"]
        },
        { type: "in", text: "Perfecto. Estoy trabajando en ello ahora mismo. En breve verás las opciones de préstamo disponibles para ti",
          time: "09:14"}
        { type: "in", text: "<b>¡Buenas noticias!</b> 🎉\nTienes S/. 5200 aprobados\nPuedes desembolsarlo por este char, fácil y sin complicarte"
         time: "09:20",
        options: ["Calcular cuota ideal"]},
      ]
    },
    {
      id: "solicitud",
      label: "2. Solicitud",
      caption: "El bot recoge los datos mínimos para iniciar la evaluación.",
      messages: [
        { type: "day", text: "Hoy" },
        { type: "out", text: "💰 Solicitar un préstamo", time: "09:14" },
        { type: "in", text: "Perfecto, vamos a iniciar tu solicitud.\nPrimero, ¿cuál es el monto que necesitas para tu negocio?", time: "09:15" },
        { type: "out", text: "S/ 3,000", time: "09:15" },
        { type: "in", text: "¿Para qué usarás el préstamo?", time: "09:15" },
        { type: "quick", options: ["Compra de mercadería", "Capital de trabajo", "Otro"] }
      ]
    },
    {
      id: "documentos",
      label: "3. Documentos",
      caption: "Se solicita el DNI mediante foto para validar identidad.",
      messages: [
        { type: "day", text: "Hoy" },
        { type: "out", text: "Compra de mercadería", time: "09:16" },
        { type: "in", text: "Gracias. Ahora necesito verificar tu identidad.\nEnvíame una foto de tu DNI (ambos lados) 📷", time: "09:16" },
        { type: "doc", name: "DNI_frontal.jpg", size: "1.2 MB", time: "09:18" },
        { type: "doc", name: "DNI_posterior.jpg", size: "1.1 MB", time: "09:18" },
        { type: "in", text: "Documento recibido ✅\nEstamos validando tu información, esto toma unos segundos...", time: "09:18" }
      ]
    },
    {
      id: "evaluacion",
      label: "4. Evaluación",
      caption: "Resultado de la evaluación crediticia con condiciones propuestas.",
      messages: [
        { type: "day", text: "Hoy" },
        { type: "in", text: "¡Buenas noticias! 🎉\nTu solicitud fue pre-aprobada.\n\nMonto: S/ 3,000\nPlazo: 12 meses\nCuota estimada: S/ 285/mes\nTEA: 45%", time: "09:20" },
        { type: "quick", options: ["✅ Aceptar condiciones", "✏️ Ajustar monto o plazo", "❌ No, gracias"] }
      ]
    },
    {
      id: "desembolso",
      label: "5. Desembolso",
      caption: "Confirmación final: el dinero se envía directo a Yape/cuenta.",
      messages: [
        { type: "day", text: "Hoy" },
        { type: "out", text: "✅ Aceptar condiciones", time: "09:21" },
        { type: "in", text: "Última confirmación: firma tu contrato digital aquí 👇", time: "09:21" },
        { type: "doc", name: "Contrato_prestamo.pdf", size: "340 KB", time: "09:21" },
        { type: "out", text: "Firmado ✍️", time: "09:23" },
        { type: "in", text: "¡Listo, André! 🎉\nS/ 3,000 fueron desembolsados a tu cuenta Yape.\n\nTu primera cuota vence el 11/09/2026.", time: "09:24" }
      ]
    }
  ];

  let currentScene = 0;

  function renderSelector() {
    const wrap = document.getElementById("sceneSelector");
    wrap.innerHTML = "";
    scenes.forEach((s, i) => {
      const btn = document.createElement("button");
      btn.className = "scene-btn" + (i === currentScene ? " active" : "");
      btn.textContent = s.label;
      btn.onclick = () => { currentScene = i; render(); };
      wrap.appendChild(btn);
    });
  }

  function bubbleHTML(msg) {
    if (msg.type === "day") {
      return `<div class="day-divider">${msg.text}</div>`;
    }

    if (msg.type === "menu") {
      const opts = msg.options.map(o => `<div class="menu-option">${o}</div>`).join("");
      return `
        <div class="bubble-row in">
          <div class="menu-bubble">
            <div class="menu-body">${msg.text}<span class="meta">${msg.time}</span></div>
            ${opts}
          </div>
        </div>`;
    }

    if (msg.type === "quick") {
      const opts = msg.options.map(o => `<div class="quick-reply-btn">${o}</div>`).join("");
      return `<div class="quick-replies">${opts}</div>`;
    }

    if (msg.type === "doc") {
      return `
        <div class="bubble-row out">
          <div class="bubble out">
            <div class="doc-card">
              <div class="doc-icon">${msg.name.endsWith(".pdf") ? "PDF" : "IMG"}</div>
              <div>
                <div class="doc-name">${msg.name}</div>
                <div class="doc-size">${msg.size}</div>
              </div>
            </div>
            <span class="meta">${msg.time}<span class="check">✓✓</span></span>
          </div>
        </div>`;
    }

    const cls = msg.type; // "in" | "out"
    const checks = cls === "out" ? `<span class="check">✓✓</span>` : "";
    return `
      <div class="bubble-row ${cls}">
        <div class="bubble ${cls}">${msg.text}<span class="meta">${msg.time}${checks}</span></div>
      </div>`;
  }

  function render() {
    renderSelector();
    const scene = scenes[currentScene];
    document.getElementById("messages").innerHTML = scene.messages.map(bubbleHTML).join("");
    document.getElementById("sceneCaption").textContent = scene.caption;
    document.getElementById("headerStatus").textContent = "en línea";
  }

  render();
</script>

</body>
</html>
